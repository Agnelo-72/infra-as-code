name: Terraform CI/CD

on:
  workflow_dispatch:   #to allow manual trigger of the workflow
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read        #importante: permite que o job acesse o repositório (infra-as-code) para fazer checkout do código

jobs:
  job1:
    name: Terraform CI
    runs-on: ubuntu-latest                    #VM onde o job será executado
    steps:
      - name: Checkout 
        uses: actions/checkout@v7.0.1
      
      - name: "Configure AWS Credentials" 
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::635096816538:role/GitHubInfraRole   #configura o role do IAM que o GitHub Actions vai assumir para executar os comandos do Terraform
          aws-region: us-east-1

      - name: HashiCorp - Setup Terraform     
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        if: github.event.inputs.apply == 'true'  #apenas executa o apply se o input do workflow for true


