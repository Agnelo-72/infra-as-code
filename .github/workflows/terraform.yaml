name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: false
        type: boolean

      plan_destroy:
        description: 'Planear a destruição do ambiente?'
        required: true
        default: false
        type: boolean

      destroy:
        description: 'Destruir o ambiente?'
        required: true
        default: false
        type: boolean

permissions:                #importante para o OIDC funcionar e permitir que o GitHub Actions assuma a role do AWS
  id-token: write
  contents: read

jobs:
  job1:
    name: Terraform CI/CD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Configure AWS Credentials                 #Assume a role in AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635096816538:role/GitHubInfraRole
          aws-region: us-east-1

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # --- FLUXO NORMAL (Criar / Atualizar) ---
      - name: Terraform Plan
        if: ${{ !inputs.plan_destroy && !inputs.destroy }}
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        if: ${{ inputs.apply && !inputs.plan_destroy && !inputs.destroy }}
        run: terraform apply -auto-approve tfplan.tfout

      # --- FLUXO DE DESTRUIÇÃO ---
      - name: Terraform Plan Destroy
        if: ${{ inputs.plan_destroy && !inputs.destroy }}
        run: terraform plan -destroy -out=tfdestroy.tfout

      - name: Terraform Destroy
        if: ${{ inputs.destroy }}
        run: terraform destroy -auto-approve           #executar o destroy sem pedir confirmação